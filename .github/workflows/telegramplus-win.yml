name: TelegramPlus Windows.

# TelegramPlus: a manual build of this fork for Windows x64.
#
# It follows the steps of the upstream win.yml, with a single configuration,
# your own API credentials and the auto-updater switched off (the official
# updater would replace this build with the stock Telegram Desktop).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   TDESKTOP_API_ID, TDESKTOP_API_HASH - from https://my.telegram.org/apps

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Debug is what upstream CI builds (faster to build, slower to run). Release also builds the release libraries and takes much longer."
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      only_cache:
        description: "Only build and cache the libraries, don't build the app (use it to split a build that doesn't fit into the 6 hours limit)."
        type: boolean
        default: false

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      CONFIGURATION: ${{ inputs.configuration }}
      API_ID: ${{ secrets.TDESKTOP_API_ID }}
      API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
      # Rust debug builds of the helper tools keep much less on disk this way.
      CARGO_INCREMENTAL: "0"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Check API credentials.
        if: ${{ !inputs.only_cache }}
        shell: bash
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Add the TDESKTOP_API_ID and TDESKTOP_API_HASH repository secrets (get them at https://my.telegram.org/apps)."
            exit 1
          fi

      # Building every library from scratch ran out of disk on the hosted
      # runner at the very last stage. Remove preinstalled toolchains this
      # build never uses. Python, Perl, LLVM, .NET and Visual Studio stay.
      - name: Free runner disk space.
        shell: pwsh
        run: |
          function Show-Free($label) {
            Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -ne $null } | ForEach-Object {
              "{0} {1}: {2:N1} GB free of {3:N1}" -f $label, $_.Name, ($_.Free / 1GB), (($_.Free + $_.Used) / 1GB)
            }
          }
          Show-Free 'before'
          $paths = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\ghcup',
            'C:\Miniconda',
            'C:\Julia',
            'C:\vcpkg',
            'C:\SeleniumWebDrivers',
            'C:\selenium',
            'C:\tools\php',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MySQL',
            'C:\Program Files\Azure Cosmos DB Emulator',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\Users\runneradmin\.rustup',
            'C:\Users\runneradmin\.cargo',
            'C:\Users\Default\.rustup',
            'C:\Users\Default\.cargo'
          ) | Where-Object { Test-Path $_ }
          $paths | ForEach-Object -Parallel {
            cmd /c rmdir /s /q "$_" 2>&1 | Out-Null
            "removed $_ (still there: $(Test-Path $_))"
          } -ThrottleLimit 8
          Show-Free 'after'
          exit 0

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "$CONFIGURATION" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-plus-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-plus-third-party-

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-plus-libs-${{ inputs.configuration }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-plus-libs-${{ inputs.configuration }}-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-plus-qt-${{ inputs.configuration }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-plus-qt-${{ inputs.configuration }}-

      - name: Libraries (debug only).
        if: ${{ inputs.configuration == 'Debug' }}
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Libraries (debug and release).
        if: ${{ inputs.configuration != 'Debug' }}
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Disk report.
        if: ${{ always() }}
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -ne $null } | ForEach-Object {
            "{0}: {1:N1} GB free of {2:N1}" -f $_.Name, ($_.Free / 1GB), (($_.Free + $_.Used) / 1GB)
          }
          exit 0

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: TelegramPlus build.
        if: ${{ !inputs.only_cache }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=%CONFIGURATION% ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config %CONFIGURATION% --parallel

      - name: Move artifact.
        if: ${{ !inputs.only_cache }}
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%CONFIGURATION%
          mkdir artifact
          move %OUT%\Telegram.exe artifact/

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: ${{ !inputs.only_cache }}
        with:
          name: TelegramPlus x64 ${{ inputs.configuration }}
          path: artifact\
          retention-days: 14
